<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Tarjetas Geometricas RA</title>
  <script src="https://aframe.io"></script>
  <script src="https://githack.com"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #ui {
      position: fixed; top: 10px; left: 10px; right: 10px; z-index: 9999;
      display: flex; justify-content: space-between; pointer-events: none;
    }
    .tag {
      background: rgba(0,0,0,0.75); color: #fff; padding: 8px 12px;
      border-radius: 6px; font-weight: bold; font-size: 14px;
    }
    button {
      pointer-events: auto; background: #0066cc; color: #fff; border: none;
      padding: 8px 14px; border-radius: 6px; font-weight: bold; font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div class="tag">Estudiante: Silvio</div>
    <button id="btn" onclick="cambiar()">Tamaño: Normal</button>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
    <a-marker preset="hiro">
      <a-box id="cubo" position="0 0.5 0" scale="1 1 1" color="#0055ff"></a-box>
    </a-marker>

    <a-marker preset="kanji">
      <a-sphere id="esfera" position="0 0.5 0" radius="0.5" scale="1 1 1" color="#ee2222"></a-sphere>
    </a-marker>

    
  </a-scene>

  <script>
    let grande = false;
    function cambiar() {
      grande = !grande;
      const s = grande ? "1.5 1.5 1.5" : "1 1 1";
      document.getElementById("cubo").setAttribute("scale", s);
      document.getElementById("esfera").setAttribute("scale", s);
      document.getElementById("btn").textContent = grande ? "Tamaño: Ampliado" : "Tamaño: Normal";
    }
  </script>
</body>
</html>
