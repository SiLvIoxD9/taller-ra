<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Tarjetas Geométricas RA - ETN 1024</title>
  <script>
    // Carga segura de librerías sin que se recorten los enlaces
    var s1 = document.createElement('script');
    s1.src = 'https://aframe.io' + '/releases/1.3.0/aframe.min.js';
    document.head.appendChild(s1);

    s1.onload = function() {
      var s2 = document.createElement('script');
      s2.src = 'https://jsdelivr.net' + '/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js';
      document.head.appendChild(s2);
    };
  </script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #ui-overlay {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 9999;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .badge {
      background: rgba(0, 0, 0, 0.75);
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
    }
    #btn-tamano {
      pointer-events: auto;
      background: #0066cc;
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="ui-overlay">
    <div class="badge">Estudiante: Silvio</div>
    <button id="btn-tamano" onclick="alternarTamano()">Tamaño: Normal</button>
  </div>

  <a-scene embedded arjs="sourceType: webcam; facingMode: environment; debugUIEnabled: false;" vr-mode-ui="enabled: false">
    
    <!-- Tarjeta A: Hiro -> Cubo Azul -->
    <a-marker preset="hiro">
      <a-box id="cubo-azul" position="0 0.5 0" scale="1 1 1" color="#0055ff"></a-box>
    </a-marker>

    <!-- Tarjeta B: Kanji -> Esfera Roja -->
    <a-marker preset="kanji">
      <a-sphere id="esfera-roja" position="0 0.5 0" radius="0.5" scale="1 1 1" color="#ee2222"></a-sphere>
    </a-marker>

    
  </a-scene>

  <script>
    let ampliado = false;

    function alternarTamano() {
      ampliado = !ampliado;
      const escala = ampliado ? "1.5 1.5 1.5" : "1 1 1";
      
      document.getElementById("cubo-azul").setAttribute("scale", escala);
      document.getElementById("esfera-roja").setAttribute("scale", escala);
      
      const boton = document.getElementById("btn-tamano");
      boton.textContent = ampliado ? "Tamaño: Ampliado" : "Tamaño: Normal";
    }
  </script>
</body>
</html>
