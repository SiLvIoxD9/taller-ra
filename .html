<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Taller AR - ETN 1024</title>

  <!--
    Versiones usadas (anotarlas en el informe):
    - A-Frame 1.3.0
    - AR.js 3.4.5 (versión A-Frame, seguimiento de marcadores)
    Base: ejemplo oficial de marcadores de AR.js (https://ar-js-org.github.io/AR.js-Docs/marker-based/)
    Cambios propios: cubo azul/esfera roja, botón de tamaño con estado común, etiqueta de estado, nombre del estudiante.
  -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    html, body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }

    /* Nombre del estudiante: arriba, lejos del centro */
    #nombre {
      position: fixed; top: 10px; left: 10px; z-index: 2147483647;
      background: rgba(0,0,0,.6); color: #fff;
      padding: 6px 12px; border-radius: 8px; font-size: 14px;
      max-width: calc(100% - 40px);
    }

    /* Botón y etiqueta: abajo, para no tapar la zona central */
    #panel {
      position: fixed; left: 10px; z-index: 2147483647;
      top: calc(env(safe-area-inset-top, 0px) + 70px);
      display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
      pointer-events: none;
    }
    #panel > * { pointer-events: auto; }
    #btnTamano {
      font-size: 18px; padding: 14px 20px; border: 2px solid #000; border-radius: 10px;
      background: #ffffff; color: #000; font-weight: bold;
      touch-action: manipulation; -webkit-appearance: none;
    }
    #etiqueta {
      background: rgba(0,0,0,.6); color: #fff;
      padding: 10px 14px; border-radius: 10px; font-size: 16px;
    }
  </style>
</head>

<body>
  <!-- Elementos de interfaz (fuera de la escena AR) -->
  <div id="nombre">Silvio Ariel, Juan Luis y Dilan Kevin <small style="opacity:.7">(v4)</small></div>
  <div id="panel">
    <button id="btnTamano">Cambiar tamaño</button>
    <span id="etiqueta">Normal</span>
  </div>

  <!-- Escena: la cámara trasera es la fuente de video -->
  <a-scene embedded
           vr-mode-ui="enabled: false"
           renderer="logarithmicDepthBuffer: true; precision: medium;"
           arjs="sourceType: webcam; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960; canvasWidth: 1280; canvasHeight: 960; maxDetectionRate: 60; debugUIEnabled: false; detectionMode: mono;">

    <!-- TARJETA A: marcador Hiro -> cubo azul -->
    <a-marker preset="kanji">
      <a-entity id="figuraA" scale="3 3 3">
        <a-box position="0 0.5 0" color="#1E6FFF"></a-sphere>
      </a-entity>
    </a-marker>

    <!-- TARJETA B: marcador Kanji -> esfera roja -->
    <a-marker preset="hiro">
      <a-entity id="figuraB" scale="3 3 3">
        <a-sphere position="0 0.5 0" radius="0.5" color="#E02020"></a-box>
      </a-entity>
    </a-marker>

    <!-- Cámara -->
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Estado común para ambas figuras: 1.0 = normal, 1.5 = ampliado
    let escala = 2.0;

    const figuraA  = document.getElementById('figuraA');
    const figuraB  = document.getElementById('figuraB');
    const etiqueta = document.getElementById('etiqueta');
    const boton    = document.getElementById('btnTamano');

    function aplicarEscala() {
      const s = escala + ' ' + escala + ' ' + escala;
      figuraA.setAttribute('scale', s);
      figuraB.setAttribute('scale', s);
      etiqueta.textContent = (escala === 2.0) ? 'Normal' : 'Ampliado';
    }

    boton.addEventListener('click', function () {
      escala = (escala === 1.0) ? 1.5 : 2.0;
      aplicarEscala();
    });

    aplicarEscala(); // arranca en Normal
  </script>
</body>
</html>
